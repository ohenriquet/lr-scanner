[workspace]
resolver = "2"
members = [
  "crates/sdd-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = ""
authors = ["projeto jlr-open-diag"]

[workspace.dependencies]
anyhow = "1.0.100"
thiserror = "2.0.17"
quick-xml = "0.38.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.37.0", features = ["bundled"] }
clap = { version = "4.5.51", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
walkdir = "2.5.0"
des = "0.8.1"
cipher = "0.4.4"
hex = "0.4.3"
