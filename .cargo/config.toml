# Projeto usa a toolchain GNU do Rust com mingw-w64 portátil (sem MSVC).
# 64 bits: C:/dev/mingw64 ; 32 bits (oráculo SecAlg): C:/dev/mingw32.
[target.x86_64-pc-windows-gnu]
linker = "C:/dev/mingw64/bin/gcc.exe"
ar = "C:/dev/mingw64/bin/ar.exe"

[target.i686-pc-windows-gnu]
linker = "C:/dev/mingw32/bin/gcc.exe"
ar = "C:/dev/mingw32/bin/ar.exe"
